[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-trading"
version = "0.1.0"
description = "Système de trading swing Long Only sur le CFD US500 (Capital.com), paper trading local."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyarrow>=15",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
bot-trading = "bot_trading.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
